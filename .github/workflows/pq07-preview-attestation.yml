name: PQ-07 preview provenance (manual only)

# A manual source-preparation interface, not an approved production release.
on:
  workflow_dispatch:
    inputs:
      intent:
        description: "Explicit preview-provenance-only operation; no publication"
        type: choice
        required: true
        options:
          - preview-provenance-only

permissions:
  contents: read

jobs:
  preview-provenance:
    if: github.ref == 'refs/heads/main' && inputs.intent == 'preview-provenance-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout main without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (operator verified tag)
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bounded wheel tooling (not a reproducibility claim)
        run: python -m pip install --disable-pip-version-check --no-deps setuptools==80.9.0 wheel==0.45.1
      - name: Build isolated preview wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Require exactly one preview wheel and log checksum
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          sha256sum "${wheels[0]}"
      - name: Generate GitHub preview build provenance (not release authority)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.whl
      - name: Retain preview bytes for manual verification (not immutable custody)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pq07-preview-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
