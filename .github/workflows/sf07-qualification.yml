name: SF-07 portable install qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Stable, independently required contexts. Do not collapse them into a matrix
# aggregate: the acceptance job must inspect BOTH precise dependency results.
jobs:
  linux:
    name: sf07-portability (ubuntu-24.04, py3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bind checked-out identity to workflow event
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha || '' }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha || '' }}
        run: |
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s workflow=%s workflow_ref=%s run=%s attempt=%s job=%s ref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW" "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$GITHUB_REF"
          printf 'github_sha=%s checked_out_sha=%s tree_sha=%s pr_head=%s pr_base=%s queue_head=%s queue_base=%s\n' "$GITHUB_SHA" "$actual" "$tree" "$PR_HEAD" "$PR_BASE" "$QUEUE_HEAD" "$QUEUE_BASE"
          test "$actual" = "$GITHUB_SHA"
      - name: Compile source and tests
        run: python -m compileall -q src/sf tests tools/ci_acceptance.py
      - name: Mandatory full suite with zero allowed skips
        run: python tools/ci_acceptance.py run-suite
      - name: CI-16 temporary merge-group required-job failure probe
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: exit 1

  windows:
    name: sf07-portability (windows-2022, py3.12)
    # CI-16 TEMPORARY: simulate a skipped required job on merge_group only.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bind checked-out identity to workflow event
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha || '' }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha || '' }}
        run: |
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s workflow=%s workflow_ref=%s run=%s attempt=%s job=%s ref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW" "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$GITHUB_REF"
          printf 'github_sha=%s checked_out_sha=%s tree_sha=%s pr_head=%s pr_base=%s queue_head=%s queue_base=%s\n' "$GITHUB_SHA" "$actual" "$tree" "$PR_HEAD" "$PR_BASE" "$QUEUE_HEAD" "$QUEUE_BASE"
          test "$actual" = "$GITHUB_SHA"
      - name: Compile source and tests
        run: python -m compileall -q src/sf tests tools/ci_acceptance.py
      - name: Mandatory full suite with zero allowed skips
        run: python tools/ci_acceptance.py run-suite

  acceptance:
    name: sf07-acceptance
    # A skipped dependency must not silently yield a green required check.
    if: ${{ always() }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out acceptance predicate with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject missing, skipped, cancelled, neutral or failed prerequisites
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: python3 tools/ci_acceptance.py check-jobs --linux "$LINUX_RESULT" --windows "$WINDOWS_RESULT"
        shell: bash
